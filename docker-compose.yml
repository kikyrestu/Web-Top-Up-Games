services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: web-top-up-games
    container_name: app
    restart: unless-stopped
    working_dir: /var/www
    ports:
      - "8008:80"
    volumes:
      - ./:/var/www
    networks:
      - web-network
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-laravel}
    ports:
      - "33066:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - web-network

networks:
  web-network:
    driver: bridge

volumes:
  dbdata:
